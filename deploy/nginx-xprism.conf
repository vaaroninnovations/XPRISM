# /etc/nginx/sites-available/xprism   (replace lab.example.com; run certbot afterwards)
upstream xprism_app { server 127.0.0.1:8001; keepalive 16; }

server {
    listen 80;
    listen [::]:80;
    server_name lab.example.com;

    client_max_body_size 5m;          # CSV / Excel uploads
    charset utf-8;

    # X-Frame-Options, X-Content-Type-Options and Referrer-Policy are sent by Django for app pages
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; media-src 'self' blob:; worker-src 'self' blob:; connect-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;

    # static files (CSS, fonts, JS, images) served directly by nginx
    location /assets/ {
        alias /opt/xprism/static/;
        expires 30d;
        add_header Cache-Control "public";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Content-Security-Policy "default-src 'self'" always;
        access_log off;
    }

    location / {
        proxy_pass http://xprism_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # slow down password guessing (in addition to the app's own account lock-out)
    location = /accounts/login/ {
        limit_req zone=mcp_login burst=10 nodelay;
        proxy_pass http://xprism_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
