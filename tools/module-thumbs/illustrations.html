<!doctype html>
<!-- Card art for the question-and-answer modules (Exp 35-43), which have no lab scene to photograph.
     Open with ?n=35 to see one; draw.js screenshots them all. Values shown come from each module. -->
<meta charset="utf-8">
<title>XPRISM card art</title>
<link rel="stylesheet" href="../../static/assets/css/theme.css">
<style>html,body{margin:0;background:#000}#stage svg{display:block;width:800px;height:500px}</style>
<script src="../../static/assets/js/lab-bench.js"></script>
<script src="../../static/assets/js/animal-art.js"></script>
<div id="stage"></div>
<script>
const f1 = v => Math.round(v * 10) / 10;
const T = (x, y, t, o = {}) => `<text x="${x}" y="${y}" font-family="${o.f || 'Inter'}" font-size="${o.s || 24}" font-weight="${o.w || 600}" fill="${o.c || '#0f172a'}" text-anchor="${o.a || 'middle'}"${o.ls ? ` letter-spacing="${o.ls}"` : ''}${o.tr ? ` transform="${o.tr}"` : ''}>${t}</text>`;
const MONO = 'JetBrains Mono', SEG = 'DSEG7';

const DEFS = `<defs>${LAB_DEFS}${typeof ANI_DEFS === 'function' ? ANI_DEFS() : ANI_DEFS}
  <filter id="sh" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="4" dy="7" stdDeviation="6" flood-color="#000" flood-opacity=".45"/></filter>
  <filter id="sh2" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="1" dy="3" stdDeviation="2" flood-color="#000" flood-opacity=".5"/></filter>
  <filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <filter id="realBlur"><feGaussianBlur stdDeviation="8"/></filter>
  <filter id="labFeather" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="12"/></filter>
  <filter id="big" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="16"/></filter>
  <linearGradient id="whiteCase" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f8fafc"/><stop offset="1" stop-color="#b8c4d2"/></linearGradient>
  <linearGradient id="darkCase" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#475569"/><stop offset="1" stop-color="#1e293b"/></linearGradient>
  <linearGradient id="panelG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#e7edf4"/></linearGradient>
  <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#eef2f7"/></linearGradient>
  <linearGradient id="hdpe" x1="0" x2="1"><stop offset="0" stop-color="#b6c2d0"/><stop offset=".35" stop-color="#f8fafc"/><stop offset=".7" stop-color="#e2e8f0"/><stop offset="1" stop-color="#8d9aab"/></linearGradient>
  <linearGradient id="amberG" x1="0" x2="1"><stop offset="0" stop-color="#3b1d06"/><stop offset=".3" stop-color="#9a5a17"/><stop offset=".5" stop-color="#b87425"/><stop offset="1" stop-color="#3b1d06"/></linearGradient>
  <linearGradient id="clearG" x1="0" x2="1"><stop offset="0" stop-color="#bae6fd" stop-opacity=".55"/><stop offset=".3" stop-color="#fff" stop-opacity=".28"/><stop offset=".7" stop-color="#e0f2fe" stop-opacity=".2"/><stop offset="1" stop-color="#7dd3fc" stop-opacity=".55"/></linearGradient>
  <linearGradient id="board" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8a6a43"/><stop offset="1" stop-color="#5c4326"/></linearGradient>
  <linearGradient id="tray" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e2e8f0" stop-opacity=".3"/><stop offset="1" stop-color="#94a3b8" stop-opacity=".22"/></linearGradient>
  <linearGradient id="bed" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e9d3a6"/><stop offset="1" stop-color="#b8935a"/></linearGradient>
  <linearGradient id="foil" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f1f5f9"/><stop offset=".5" stop-color="#94a3b8"/><stop offset="1" stop-color="#e2e8f0"/></linearGradient>
  <radialGradient id="wellSh" cx=".5" cy=".42" r=".6"><stop offset=".55" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".26"/></radialGradient>
  <radialGradient id="pocket" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#5eead4" stop-opacity=".5"/><stop offset=".7" stop-color="#22d3ee" stop-opacity=".2"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0"/></radialGradient>
  <pattern id="lightTile" width="74" height="52" patternUnits="userSpaceOnUse"><rect width="73" height="51" fill="#f1f5f9" stroke="#d3dce6" stroke-width="1.2"/></pattern>
</defs>`;

const svg = inner => `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 625">${DEFS}${inner}</svg>`;
const room = (y = 505) => `<rect width="1000" height="${y}" fill="url(#wall)"/><rect width="1000" height="${y}" fill="url(#labTile)"/><rect width="1000" height="${y}" fill="url(#spot)"/><rect y="${y + 3}" width="1000" height="${622 - y}" fill="url(#bench)"/><rect y="${y - 3}" width="1000" height="6" fill="url(#labBevel)"/>`;
const shade = (x, y, r) => `<ellipse cx="${x}" cy="${y + 2}" rx="${r}" ry="${Math.max(5, r * .12)}" fill="#000" opacity=".55" filter="url(#labSoft)"/>`;

// x = centre, y = base
function bottle(x, y, w, h, o = {}) {
  const t = y - h, n = w * .44, cap = h * .13, sh = h * .15;
  const d = `M${x - w / 2 + 9} ${y} L${x + w / 2 - 9} ${y} Q${x + w / 2} ${y} ${x + w / 2} ${y - 9} L${x + w / 2} ${t + cap + sh + 16} Q${x + w / 2} ${t + cap + sh} ${x + n / 2} ${t + cap + sh * .35} L${x + n / 2} ${t + cap} L${x - n / 2} ${t + cap} L${x - n / 2} ${t + cap + sh * .35} Q${x - w / 2} ${t + cap + sh} ${x - w / 2} ${t + cap + sh + 16} L${x - w / 2} ${y - 9} Q${x - w / 2} ${y} ${x - w / 2 + 9} ${y} Z`;
  const lw = w * .86, lh = o.lh || h * .4, ly = y - h * .1 - lh;
  const ls = (o.sub ? [T(x, ly + lh * .46, o.lab, { s: o.s || w * .26, w: 800, c: o.lc || '#0f172a' }), T(x, ly + lh * .82, o.sub, { s: (o.s || w * .26) * .68, w: 600, c: '#475569' })] : [T(x, ly + lh * .64, o.lab || '', { s: o.s || w * .26, w: 800, c: o.lc || '#0f172a' })]).join('');
  return `<g filter="url(#sh2)"><path d="${d}" fill="${o.fill || 'url(#hdpe)'}" stroke="#475569" stroke-width="1"/>${o.liq ? `<path d="M${x - w / 2 + 4} ${y - 4} L${x + w / 2 - 4} ${y - 4} L${x + w / 2 - 4} ${t + cap + sh + 24} L${x - w / 2 + 4} ${t + cap + sh + 24} Z" fill="${o.liq}"/>` : ''}<rect x="${x - n / 2 - 5}" y="${t}" width="${n + 10}" height="${cap + 2}" rx="4" fill="${o.cap || '#334155'}" stroke="#0f172a" stroke-opacity=".5"/><rect x="${x - n / 2 - 5}" y="${t + 4}" width="${n + 10}" height="3" fill="#fff" opacity=".22"/>
    <rect x="${x - lw / 2}" y="${ly}" width="${lw}" height="${lh}" rx="3" fill="url(#paper)" stroke="#94a3b8" stroke-width=".8"/>${o.band ? `<rect x="${x - lw / 2}" y="${ly}" width="${lw}" height="7" fill="${o.band}"/>` : ''}${ls}
    <rect x="${x - w / 2 + 7}" y="${t + cap + sh + 20}" width="${w * .1}" height="${h * .62}" rx="4" fill="#fff" opacity=".28"/></g>`;
}

// x = centre. layers bottom-up as [fraction of height reached, colour]
let clipN = 0;
function tube(x, top, base, w, layers, cap) {
  const h = base - top, id = 'c' + (++clipN), d = `M${x - w / 2} ${top} L${x - w / 2} ${base - w / 2} A${w / 2} ${w / 2} 0 0 0 ${x + w / 2} ${base - w / 2} L${x + w / 2} ${top} Z`;
  let prev = 0, g = '';
  layers.forEach(([to, c]) => { g += `<rect x="${x - w}" y="${base - h * to}" width="${w * 2}" height="${h * (to - prev) + 1}" fill="${c}"/>`; prev = to; });
  const lvl = base - h * prev;
  return `<clipPath id="${id}"><path d="${d}"/></clipPath><g clip-path="url(#${id})">${g}<ellipse cx="${x}" cy="${lvl}" rx="${w / 2}" ry="4" fill="#fff" opacity=".4"/><rect x="${x + w * .2}" y="${top}" width="${w * .3}" height="${h}" fill="#000" opacity=".1"/></g><path d="${d}" fill="url(#clearG)" stroke="#dbeafe" stroke-opacity=".9" stroke-width="1.6"/><rect x="${x - w * .32}" y="${top + 16}" width="${w * .14}" height="${h - 50}" rx="3" fill="#fff" opacity=".42"/>${cap ? `<rect x="${x - w / 2 - 4}" y="${top - 26}" width="${w + 8}" height="34" rx="5" fill="${cap}" stroke="#000" stroke-opacity=".3"/><rect x="${x - w / 2 - 4}" y="${top - 21}" width="${w + 8}" height="5" fill="#fff" opacity=".32"/>` : ''}`;
}

// Steel rack around the tubes: draws the tubes between its back and front rails
function rack(x0, x1, top, base, tubes) {
  return `${shade((x0 + x1) / 2, base + 12, (x1 - x0) / 2)}<rect x="${x0}" y="${top}" width="${x1 - x0}" height="12" rx="3" fill="url(#steelH)" opacity=".55"/><rect x="${x0 + 6}" y="${top}" width="9" height="${base - top + 14}" fill="url(#steel)"/><rect x="${x1 - 15}" y="${top}" width="9" height="${base - top + 14}" fill="url(#steel)"/>${tubes}<rect x="${x0}" y="${top + 6}" width="${x1 - x0}" height="12" rx="3" fill="url(#steelH)"/><rect x="${x0 - 8}" y="${base}" width="${x1 - x0 + 16}" height="14" rx="4" fill="url(#steelH)"/>`;
}

const scenes = {
  // ADR report for the module's Case 1, with its Naranjo total (6, probable)
  35() {
    const cx = 735, cy = 302, r0 = 128, r1 = 196;
    const ang = s => Math.PI - ((s + 4) / 17) * Math.PI, pol = (r, a) => `${f1(cx + r * Math.cos(a))} ${f1(cy - r * Math.sin(a))}`;
    const seg = (s0, s1, c) => `<path d="M${pol(r1, ang(s0))} A${r1} ${r1} 0 0 1 ${pol(r1, ang(s1))} L${pol(r0, ang(s1))} A${r0} ${r0} 0 0 0 ${pol(r0, ang(s0))} Z" fill="${c}" stroke="#0b1220" stroke-width="3"/>`;
    const tag = (s, t) => { const a = ang(s), R = (r0 + r1) / 2 - 8, x = f1(cx + R * Math.cos(a)), y = f1(cy - R * Math.sin(a)); return T(x, y, t, { s: 23, w: 800, c: '#0b1220', tr: `rotate(${f1(90 - a * 180 / Math.PI)} ${x} ${y})` }); };
    const field = (y, k, v) => T(96, y, k, { s: 20, w: 600, c: '#64748b', a: 'start' }) + T(96, y + 36, v, { s: 30, w: 800, c: '#0a1f44', a: 'start' }) + `<line x1="96" x2="410" y1="${y + 50}" y2="${y + 50}" stroke="#cbd5e1" stroke-width="1.5"/>`;
    const tick = (x, y, on, t) => `<rect x="${x}" y="${y}" width="26" height="26" rx="4" fill="#fff" stroke="#475569" stroke-width="2"/>${on ? `<path d="M${x + 5} ${y + 14} l6 7 l11 -15" fill="none" stroke="#7e13b5" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>` : ''}${T(x + 36, y + 21, t, { s: 23, a: 'start', c: '#1e293b' })}`;
    let pills = '';
    for (let r = 0; r < 2; r++) for (let c = 0; c < 5; c++) pills += `<ellipse cx="${708 + c * 48}" cy="${541 + r * 42}" rx="18" ry="15" fill="#f8fafc" stroke="#64748b" stroke-width="1.4"/><ellipse cx="${704 + c * 48}" cy="${536 + r * 42}" rx="9" ry="5" fill="#fff" opacity=".9"/>`;
    return svg(`${room()}
      <g filter="url(#sh)"><rect x="505" y="34" width="462" height="402" rx="14" fill="#101828" stroke="#475569" stroke-width="2"/>
        ${T(736, 84, 'NARANJO SCORE', { s: 31, w: 800, c: '#e2e8f0', f: MONO, ls: 2 })}
        ${seg(-4, .5, '#94a3b8')}${seg(.5, 4.5, '#fbbf24')}${seg(4.5, 8.5, '#2dd4bf')}${seg(8.5, 13, '#c084fc')}
        ${tag(-1.8, 'Doubtful')}${tag(2.5, 'Possible')}${tag(6.5, 'Probable')}${tag(10.8, 'Definite')}
        <line x1="${cx}" y1="${cy}" x2="${f1(cx + (r0 - 10) * Math.cos(ang(6)))}" y2="${f1(cy - (r0 - 10) * Math.sin(ang(6)))}" stroke="#f8fafc" stroke-width="7" stroke-linecap="round"/><circle cx="${cx}" cy="${cy}" r="15" fill="#f8fafc" stroke="#475569" stroke-width="3"/>
        ${T(632, 412, '6', { s: 88, w: 800, c: '#2dd4bf', f: MONO })}${T(805, 402, 'PROBABLE', { s: 46, w: 800, c: '#2dd4bf' })}</g>
      ${shade(250, 588, 200)}
      <g transform="rotate(-2 250 310)" filter="url(#sh)"><rect x="56" y="34" width="392" height="556" rx="14" fill="url(#board)" stroke="#3f2d17" stroke-width="2"/>
        <rect x="76" y="66" width="352" height="508" rx="3" fill="url(#paper)"/><rect x="76" y="66" width="352" height="74" fill="#0a1f44"/>
        ${T(252, 99, 'ADVERSE DRUG REACTION', { s: 25, w: 800, c: '#fff' })}${T(252, 127, 'Suspected reaction report', { s: 20, w: 500, c: '#bae6fd' })}
        ${field(174, 'Suspected medicine', 'Ramipril 5 mg')}${field(268, 'Reaction', 'Persistent dry cough')}${field(362, 'Onset after first dose', '21 days')}
        ${T(96, 470, 'Seriousness', { s: 20, c: '#64748b', a: 'start' })}${tick(96, 486, false, 'Serious')}${tick(96, 526, true, 'Not serious')}
        <rect x="186" y="14" width="132" height="44" rx="8" fill="url(#steelH)" stroke="#334155"/><circle cx="252" cy="27" r="9" fill="#1e293b"/></g>
      ${shade(514, 574, 54)}${bottle(514, 574, 98, 168, { lab: 'Ramipril', sub: '5 mg', cap: '#7e13b5', band: '#7e13b5', s: 21 })}
      ${shade(824, 610, 150)}<g transform="rotate(-3 820 560)" filter="url(#sh2)"><rect x="672" y="512" width="300" height="100" rx="8" fill="url(#foil)" stroke="#64748b"/>${pills}</g>`);
  },

  // The module's 3Rs and its housing ranges: 22 ± 3 °C, 30 to 70% RH, 12 h light : 12 h dark
  36() {
    const rule = (y, c, t, u) => `<rect x="62" y="${y}" width="58" height="58" rx="12" fill="${c}"/>${T(91, y + 43, 'R', { s: 42, w: 800, c: '#fff' })}${T(136, y + 38, t, { s: 37, w: 800, a: 'start' })}${u ? '' : ''}`;
    const row = (y, k, v, u, c) => `${T(662, y, k, { s: 22, w: 700, c: '#94a3b8', a: 'start', f: MONO })}${T(928, y + 10, v, { s: 54, c, a: 'end', f: SEG, w: 700 })}${u ? T(936, y + 8, u, { s: 26, c, a: 'start' }) : ''}`;
    const m = (x, flip, s = 2.7) => `<g transform="translate(${x} 474) scale(${flip ? -s : s} ${s})">${animalSideArt({ kind: 'mouse', life: 'none' })}</g>`;
    let flakes = ''; for (let i = 0; i < 90; i++) { const x = 262 + (i * 83.7) % 476, y = 478 + (i * 37.3) % 44; flakes += `<ellipse cx="${f1(x)}" cy="${f1(y)}" rx="${5 + (i % 3) * 2}" ry="${2 + i % 2}" fill="${i % 3 ? '#f4e3bd' : '#a98752'}" opacity=".85" transform="rotate(${i * 47 % 180} ${f1(x)} ${f1(y)})"/>`; }
    return svg(`${room()}
      <g filter="url(#sh)"><rect x="40" y="30" width="390" height="262" rx="4" fill="url(#paper)"/><circle cx="235" cy="44" r="8" fill="#dc2626"/>
        ${T(235, 88, 'THE 3Rs', { s: 30, w: 800, c: '#7e13b5', ls: 3 })}${rule(104, '#7e13b5', 'Replacement')}${rule(166, '#0d9488', 'Reduction')}${rule(228, '#d97706', 'Refinement')}</g>
      <g filter="url(#sh)"><rect x="640" y="30" width="330" height="232" rx="12" fill="#101828" stroke="#475569" stroke-width="2"/>
        ${T(805, 68, 'ANIMAL ROOM', { s: 24, w: 800, c: '#e2e8f0', f: MONO, ls: 2 })}
        ${row(126, 'TEMP', '22', '°C', '#f87171')}${row(186, 'HUMIDITY', '55', '%', '#4ade80')}${row(244, 'LIGHT', '12:12', 'h', '#fbbf24')}</g>
      <g transform="rotate(3 515 170)" filter="url(#sh)"><rect x="452" y="58" width="126" height="176" rx="3" fill="url(#paper)"/>${T(515, 92, 'IAEC', { s: 26, w: 800, c: '#0a1f44' })}${T(515, 116, 'protocol', { s: 19, w: 600, c: '#475569' })}<g transform="rotate(-14 515 174)"><circle cx="515" cy="174" r="44" fill="none" stroke="#16a34a" stroke-width="4"/><circle cx="515" cy="174" r="37" fill="none" stroke="#16a34a" stroke-width="1.6"/>${T(515, 181, 'APPROVED', { s: 16, w: 800, c: '#16a34a' })}</g></g>
      ${shade(500, 528, 290)}
      <path d="M232 342 L768 342 L746 530 L254 530 Z" fill="url(#tray)" stroke="#e2e8f0" stroke-opacity=".6" stroke-width="2"/>
      <path d="M250 476 L750 476 L746 530 L254 530 Z" fill="url(#bed)"/>${flakes}
      ${m(345, false, 3.1)}${m(560, true, 3.1)}${m(650, false, 3.1)}${m(452, false, 2.6)}
      <path d="M232 342 L768 342 L746 530 L254 530 Z" fill="#fff" opacity=".05"/><path d="M262 352 L300 352 L280 520 L262 520 Z" fill="#fff" opacity=".12"/>
      <rect x="216" y="316" width="568" height="30" rx="6" fill="url(#steelH)" stroke="#475569"/>${Array.from({ length: 42 }, (_, i) => `<rect x="${226 + i * 13}" y="320" width="6" height="22" rx="2" fill="#475569" opacity=".65"/>`).join('')}
      <g filter="url(#sh2)"><rect x="286" y="356" width="236" height="46" rx="4" fill="#fff5cf" stroke="#b45309"/>${T(404, 388, 'Swiss albino mice', { s: 26, w: 800, c: '#78350f' })}</g>
      <g filter="url(#sh2)"><path d="M570 318 L570 350 L580 372 L590 372 L600 350 L600 318 Z" fill="url(#steel)"/><rect x="541" y="214" width="88" height="106" rx="14" fill="url(#clearG)" stroke="#e0f2fe" stroke-width="2"/><rect x="547" y="244" width="76" height="70" rx="10" fill="url(#liquid)"/><rect x="557" y="200" width="56" height="18" rx="4" fill="#334155"/></g>`);
  },

  // Trial design: phases, randomisation into two arms, matching coded kits for blinding
  37() {
    const box = (x, y, w, h, t, c, tc = '#0f172a', s = 30) => `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="12" fill="${c}" stroke="#0f172a" stroke-opacity=".28" stroke-width="2"/>${[].concat(t).map((l, i, a) => T(x + w / 2, y + h / 2 + s * .36 + (i - (a.length - 1) / 2) * s * 1.2, l, { s, w: 800, c: tc })).join('')}`;
    const arrow = (d, c = '#334155') => `<path d="${d}" fill="none" stroke="${c}" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah)"/>`;
    const phases = ['Phase I', 'Phase II', 'Phase III', 'Phase IV'].map((p, i) => `<path d="M${64 + i * 222} 52 h196 l26 28 l-26 28 h-196 l26 -28 Z" fill="${i === 2 ? '#7e13b5' : '#dbe3ee'}"/>${T(174 + i * 222, 92, p, { s: 31, w: 800, c: i === 2 ? '#fff' : '#334155' })}`).join('');
    const binder = (x, c, t) => `<g filter="url(#sh2)"><rect x="${x}" y="312" width="70" height="194" rx="5" fill="${c}"/><rect x="${x + 6}" y="312" width="9" height="194" fill="#fff" opacity=".16"/><rect x="${x + 12}" y="334" width="46" height="150" rx="3" fill="url(#paper)"/><circle cx="${x + 35}" cy="492" r="0" />${T(0, 0, t, { s: 27, w: 800, c: '#0a1f44', tr: `translate(${x + 45} 409) rotate(-90)` })}</g>`;
    const kit = (x, t) => `${shade(x, 566, 56)}${bottle(x, 566, 104, 158, { lab: 'KIT', sub: t, cap: '#f8fafc', band: '#0d9488', s: 26, lh: 74 })}`;
    return svg(`${room()}
      <defs><marker id="ah" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#334155"/></marker></defs>
      <g filter="url(#sh)"><rect x="34" y="24" width="932" height="318" rx="8" fill="url(#steelH)"/><rect x="44" y="34" width="912" height="298" rx="3" fill="#fbfcfe"/>
        ${phases}
        ${box(70, 168, 196, 104, ['Eligible', 'participants'], '#e0f2fe', '#0a1f44', 27)}
        ${arrow('M272 220 H330')}
        <circle cx="388" cy="220" r="50" fill="#7e13b5"/>${T(388, 240, 'R', { s: 58, w: 800, c: '#fff' })}
        ${arrow('M434 196 Q470 160 508 156')}${arrow('M434 244 Q470 280 508 286')}
        ${box(516, 124, 214, 66, 'Test drug', '#ccfbf1', '#134e4a', 30)}${box(516, 252, 214, 66, 'Comparator', '#fef3c7', '#78350f', 30)}
        ${arrow('M738 156 Q780 165 806 200')}${arrow('M738 286 Q780 276 806 242')}
        ${box(812, 176, 128, 90, ['End-', 'point'], '#ede9fe', '#4c1d95', 27)}</g>
