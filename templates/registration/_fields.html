{% for f in form %}
<div>
  {% if f.widget_type == 'checkbox' %}
  <label class="flex items-start gap-2 text-xs text-slate-700">{{ f }} <span>{{ f.label }}</span></label>
  {% else %}
  <label for="{{ f.id_for_label }}" class="block text-xs font-semibold text-slate-700 mb-1">{{ f.label }}</label>{{ f }}
  {% endif %}
  {% if f.help_text %}<p class="text-[11px] text-slate-500 mt-1">{{ f.help_text|safe }}</p>{% endif %}
  {% for e in f.errors %}<p class="text-[11px] text-rose-700 mt-1">{{ e }}</p>{% endfor %}
</div>
{% endfor %}
