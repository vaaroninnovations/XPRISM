{% extends 'registration/_card.html' %}
{% block title %}Reset password{% endblock %}
{% block card %}
<div><div class="mono text-[11px] text-teal-700 font-bold">FORGOT PASSWORD</div><h1 class="text-xl font-bold text-slate-900">Reset by e-mail</h1>
<p class="text-xs text-slate-500 mt-1">Enter the e-mail on your account. No e-mail on file? Ask your faculty or college admin to reset your password.</p></div>
<form method="post" class="space-y-3">{% csrf_token %}
  <div><label for="id_email" class="block text-xs font-semibold text-slate-700 mb-1">E-mail</label><input type="email" name="email" id="id_email" required class="w-full bg-white border border-slate-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-teal-500"></div>
  <button class="w-full py-2.5 rounded-lg bg-teal-600 hover:bg-teal-700 text-white text-sm font-semibold shadow">Send reset link</button>
</form>
{% endblock %}
